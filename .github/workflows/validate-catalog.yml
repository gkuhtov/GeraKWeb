name: Validate catalog

on:
  push:
    branches: [main]
    paths:
      - "assets/js/gerastore.js"
      - "data/apps.json"
      - ".github/workflows/validate-catalog.yml"
  pull_request:
    branches: [main]
    paths:
      - "assets/js/gerastore.js"
      - "data/apps.json"
      - ".github/workflows/validate-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check assets/js/gerastore.js
      - name: Validate catalog JSON and local resources
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path(".")
          repo = json.loads((root / "repo.json").read_text(encoding="utf-8"))
          fallback = json.loads((root / "data/apps.json").read_text(encoding="utf-8"))
          apps = repo.get("appRepositories")
          assert isinstance(apps, list) and apps, "repo.json must contain appRepositories"
          assert isinstance(fallback.get("apps"), list) and fallback["apps"], "fallback catalog must contain apps"
          assert not any(a.get("name") == "GeraStore Demo" for a in fallback["apps"]), "demo card must not be shipped"
          ids = [a.get("bundleIdentifier") or a.get("bundleID") for a in apps]
          ids = [value for value in ids if value]
          assert len(ids) == len(set(ids)), "duplicate bundle identifiers detected"

          for app in apps:
              assert app.get("appName"), "application without appName"
              assert app.get("appPackage"), f"missing IPA URL: {app.get('appName')}"
              assert app.get("appImage"), f"missing icon URL: {app.get('appName')}"
              for version in app.get("versions", []):
                  icon = version.get("iconURL", "")
                  if icon:
                      assert icon.startswith("https://"), f"version icon must be absolute HTTPS: {app.get('appName')}"
                  plist = version.get("appPlist", "")
                  if plist:
                      parsed = urlparse(plist)
                      assert parsed.scheme == "https" and parsed.netloc == "gkuhtov.github.io", f"invalid plist URL: {plist}"
                      rel = parsed.path.removeprefix("/GeraKStore/")
                      assert (root / rel).is_file(), f"plist file missing: {rel}"

          print(f"OK: {len(apps)} store apps, {len(fallback['apps'])} fallback apps, unique IDs, valid local plist files.")
          PY
