name: Validate catalog

on:
  push:
    branches: [main]
    paths:
      - "assets/js/gerastore.js"
      - "data/apps.json"
      - ".github/workflows/validate-catalog.yml"
  pull_request:
    branches: [main]
    paths:
      - "assets/js/gerastore.js"
      - "data/apps.json"
      - ".github/workflows/validate-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check assets/js/gerastore.js
      - name: Validate fallback catalog
        run: |
          python3 - <<'PY'
          import json
          from urllib.parse import urlparse
          from pathlib import Path

          catalog = json.loads(Path("data/apps.json").read_text(encoding="utf-8"))
          apps = catalog.get("apps")
          assert isinstance(apps, list) and apps, "fallback catalog must contain apps"
          assert not any(a.get("name") == "GeraStore Demo" for a in apps), "demo card must not be shipped"
          ids = [a.get("bundleIdentifier") for a in apps if a.get("bundleIdentifier")]
          assert len(ids) == len(set(ids)), "duplicate bundle identifiers detected"

          for app in apps:
              assert app.get("name"), "application without a name"
              assert app.get("downloadURL") and app["downloadURL"] != "#", f"missing download URL: {app.get('name')}"
              icon = app.get("iconURL", "")
              assert icon.startswith("https://") or (icon and (Path(icon).is_file() or icon.startswith("assets/"))), f"invalid icon URL: {app.get('name')}"
              for version in app.get("versions", []):
                  url = version.get("iconURL", "")
                  if url:
                      assert url.startswith("https://"), f"version icon must be absolute HTTPS: {app.get('name')}"

          print(f"OK: {len(apps)} real fallback apps, unique IDs, download links and icon references present.")
          PY
